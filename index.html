<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4fd8">
<title>The Moon Borrowed My Sandwich From Tuesday</title>
<style>
  :root { --ink:#171329; --glass:rgba(255,255,255,.78); }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; }
  body {
    color:var(--ink); overflow:hidden; min-height:100svh;
    background:linear-gradient(125deg,#ff4fd8,#ff9f43,#ffe66d,#55efc4,#54a0ff,#a55eea,#ff4fd8);
    background-size:400% 400%; animation:bgshift 14s ease infinite;
    display:grid; place-items:center; padding:16px;
  }
  @keyframes bgshift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .blob { position:fixed; width:240px;height:240px;border-radius:50%;filter:blur(2px);opacity:.42;pointer-events:none;animation:float 9s ease-in-out infinite alternate; }
  .b1{background:#fff36d;top:-75px;left:-65px}.b2{background:#ff6bcb;right:-85px;bottom:-65px;animation-delay:-3s}
  @keyframes float { to{transform:translate(35px,45px) scale(1.2)} }
  .app { position:relative; width:min(680px,100%); z-index:1; }
  .top { display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 12px;color:#21183b;font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 0 #ffffff80 }
  .counter { background:#fff9;padding:9px 13px;border:2px solid #fff;border-radius:99px;box-shadow:0 5px 0 #27174620;white-space:nowrap }
  .track { height:11px;border-radius:99px;background:#ffffff80;border:2px solid #fff;overflow:hidden;margin-bottom:14px }
  .fill {height:100%;width:5%;border-radius:99px;background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .card { min-height:min(530px,67svh);background:var(--glass);border:3px solid #fff;border-radius:32px;padding:clamp(24px,6vw,54px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 22px 70px #30134a35, inset 0 1px 0 #fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:relative;overflow:hidden; }
  .card:before {content:"";position:absolute;inset:9px;border:1px dashed #4a2c7540;border-radius:23px;pointer-events:none}
  .emoji {font-size:clamp(42px,10vw,72px);line-height:1;margin-bottom:26px;filter:drop-shadow(0 7px 0 #24133b18);animation:bop 2.3s ease-in-out infinite}
  @keyframes bop {50%{transform:translateY(-8px) rotate(5deg)}}
  .eyebrow {font-size:11px;letter-spacing:.22em;font-weight:1000;opacity:.55;margin-bottom:15px}
  h1 {font-size:clamp(30px,7.5vw,58px);line-height:1.08;letter-spacing:-.045em;margin:0;max-width:560px;text-wrap:balance;text-shadow:0 2px 0 #fff9}
  .sub {font-size:13px;font-weight:800;opacity:.55;margin-top:22px}
  .controls {display:flex;gap:12px;margin-top:16px}
  button {font:inherit;border:0;cursor:pointer;touch-action:manipulation}
  .next {flex:1;padding:18px 24px;border-radius:18px;color:white;font-weight:1000;font-size:16px;letter-spacing:.04em;background:linear-gradient(100deg,#ff3cac,#784ba0,#2b86c5);box-shadow:0 7px 0 #30204e45,0 12px 24px #30204e25;transition:transform .15s,filter .15s}
  .next:active{transform:translateY(5px);box-shadow:0 2px 0 #30204e45}
  .back {padding:0 20px;border-radius:18px;background:#fff9;border:2px solid #fff;color:#281d43;font-weight:900}
  .hint{text-align:center;font-size:11px;font-weight:800;color:#25173d99;margin-top:13px}
  .enter {animation:enter .42s cubic-bezier(.2,.8,.2,1) both}
  @keyframes enter {from{opacity:0;transform:translateX(35px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
  .final {background:linear-gradient(135deg,#fff0f7,#fff7ce,#f2eaff)}
  .final h1 {font-size:clamp(27px,7vw,53px);line-height:1.16}
  .final .emoji {animation:finalbop .55s ease-in-out infinite alternate}
  @keyframes finalbop {to{transform:scale(1.18) rotate(-8deg)}}
  .flash {animation:flash .35s ease 2}
  @keyframes flash {50%{filter:brightness(1.7) saturate(1.6)}}
  .confetti {position:fixed;top:-20px;width:10px;height:16px;z-index:5;pointer-events:none;animation:fall var(--dur) linear forwards;transform:rotate(var(--rot))}
  @keyframes fall {to{transform:translate3d(var(--x),110svh,0) rotate(850deg);opacity:.8}}
  @media(max-width:420px){body{padding:12px}.card{min-height:62svh;border-radius:26px}.controls{gap:8px}.back{padding:0 15px}.next{padding:17px 12px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main class="app" aria-live="polite">
  <div class="top"><span>THE DEPARTMENT OF NONSENSE</span><span class="counter" id="counter">01 / 20</span></div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <section class="card" id="card">
    <div class="emoji" id="emoji">🛸</div>
    <div class="eyebrow" id="eyebrow">AN IMPORTANT THOUGHT</div>
    <h1 id="quote">The moon borrowed my sandwich from Tuesday.</h1>
    <div class="sub" id="sub">please think about this for absolutely no reason</div>
  </section>
  <div class="controls">
    <button class="back" id="back" type="button">← BACK</button>
    <button class="next" id="next" type="button">NEXT PAGE →</button>
  </div>
  <div class="hint" id="hint">SWIPE LEFT OR TAP NEXT. THERE IS NO DEEPER MEANING.</div>
</main>
<script>
const pages = [
 ["🛸","The moon borrowed my sandwich from Tuesday.","please think about this for absolutely no reason"],
 ["🧃","A triangle is just a square doing its best.","geometry has entered the chat"],
 ["🦆","Never trust a staircase with unfinished business.","the steps know what they did"],
 ["🍉","The color blue tastes like a Wednesday afternoon.","source: the fridge"],
 ["🪑","A chair is a table that gave up standing.","deeply uncomfortable furniture facts"],
 ["🐸","If clouds had pockets, the sky would be rich.","financial weather report"],
 ["🥔","The potato remembers every version of itself.","stay humble, tuber"],
 ["🧦","Two missing socks are probably starting a podcast.","episode one: where did we go?"],
 ["🪐","Saturn wears rings because commitment is important.","cosmic relationship advice"],
 ["🧀","Cheese is just milk with a long-term plan.","aged wisdom"],
 ["🦖","Dinosaurs never had to update their passwords.","ancient cybersecurity"],
 ["🧋","A spoon is a tiny boat for soup.","nautical nonsense"],
 ["🧠","Your shadow is just you in low brightness mode.","turn up the sun"],
 ["🍞","Bread is a pillow that went to cooking school.","rise and grind"],
 ["🦀","The ocean is just Earth's giant soup bowl.","do not stir"],
 ["🪞","Mirrors are windows that got shy.","respect their privacy"],
 ["🚲","A wheel is a circle that found its purpose.","keep rolling, probably"],
 ["🌽","Corn is just popcorn waiting for character development.","cinema is calling"],
 ["🦑","The alphabet is a conga line of tiny symbols.","A started it"],
 ["💀","Reality is a group project and nobody read the instructions.","good luck, everybody"]
];
const finalText = "thukra ke meyra payar meyea intekaam dekhegi twin. 💔😅😔👍🏻";
let index = 0;
const $ = id => document.getElementById(id);
function confettiBurst(){
  const colors=["#ff3cac","#784ba0","#2b86c5","#ffe66d","#55efc4","#ff7043","#fff"];
  for(let i=0;i<95;i++){
    const p=document.createElement("i");p.className="confetti";
    p.style.left=Math.random()*100+"vw";p.style.background=colors[i%colors.length];
    p.style.setProperty("--x",(Math.random()*260-130)+"px");
    p.style.setProperty("--dur",(2.1+Math.random()*2.4)+"s");
    p.style.setProperty("--rot",(Math.random()*180)+"deg");
    p.style.borderRadius=Math.random()>.5?"50%":"2px";
    document.body.appendChild(p);setTimeout(()=>p.remove(),4800);
  }
}
function render(){
  const card=$("card");card.classList.remove("enter","flash","final");
  void card.offsetWidth;card.classList.add("enter");
  $("counter").textContent=String(index+1).padStart(2,"0")+" / 20";
  $("fill").style.width=((index+1)/20*100)+"%";
  $("back").disabled=index===0;$("back").style.opacity=index===0?".4":"1";
  if(index===19){
    card.classList.add("final","flash");
    $("emoji").textContent="💔";
    $("eyebrow").textContent="THE PROPHECY HAS ARRIVED";
    $("quote").textContent=finalText;
    $("sub").textContent="THE END. TWIN. THE END.";
    $("next").textContent="RESTART THE NONSENSE ↻";
    $("hint").textContent="YOU HAVE REACHED THE DESTINATION. IT WAS NOT WORTH IT.";
    setTimeout(confettiBurst,450);
  } else {
    const p=pages[index];
    $("emoji").textContent=p[0];$("eyebrow").textContent="AN IMPORTANT THOUGHT";
    $("quote").textContent=p[1];$("sub").textContent=p[2];
    $("next").textContent="NEXT PAGE →";
    $("hint").textContent="SWIPE LEFT OR TAP NEXT. THERE IS NO DEEPER MEANING.";
  }
}
function next(){if(index===19){index=0;}else index++;render();}
function back(){if(index>0){index--;render();}}
$("next").addEventListener("click",next);$("back").addEventListener("click",back);
let startX=0,startY=0;
$("card").addEventListener("touchstart",e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY;},{passive:true});
$("card").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?next():back();}},{passive:true});
$("card").addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")startX=e.clientX;});
$("card").addEventListener("pointerup",e=>{if(e.pointerType==="mouse"){const dx=e.clientX-startX;if(Math.abs(dx)>70)dx<0?next():back();}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();next();}if(e.key==="ArrowLeft")back();});
render();
</script>
</body>
</html>
